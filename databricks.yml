bundle:
  name: databricks_enterprise_project

include:
  - resources/*.yml
  - resources/**/*.yml

sync:
  include:
    - src/**
    - notebooks/**
    - config/**
    - sql/**
    - scripts/**
  exclude:
    - "**/__pycache__/**"
    - "**/*.pyc"

variables:
  workspace_host:
    description: Databricks workspace URL for the selected target
    default: https://<workspace-url>
  catalog:
    description: Unity Catalog catalog used by the platform
    default: enterprise_dev
  schema:
    description: Default Unity Catalog schema used by the platform
    default: platform

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.workspace_host}
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: enterprise_dev
      schema: platform_dev

  test:
    mode: development
    workspace:
      host: ${var.workspace_host}
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: enterprise_test
      schema: platform_test

  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: enterprise_prod
      schema: platform
