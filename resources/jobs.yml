resources:
  jobs:
    enterprise_medallion_job:
      name: ${bundle.name}-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: ingestion
          spark_python_task:
            python_file: ../notebooks/ingestion/run_ingestion.py
        - task_key: bronze
          depends_on: [{task_key: ingestion}]
          spark_python_task:
            python_file: ../notebooks/bronze/run_bronze.py
        - task_key: silver
          depends_on: [{task_key: bronze}]
          spark_python_task:
            python_file: ../notebooks/silver/run_silver.py
        - task_key: gold
          depends_on: [{task_key: silver}]
          spark_python_task:
            python_file: ../notebooks/gold/run_gold.py
